<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提問課｜工作優化指南・互動式系統練習</title>
<style>
  :root{
    --bg:#f5f1ea;
    --card:#ffffff;
    --ink:#201c18;
    --sub:#6b6560;
    --accent:#c2793c;
    --accent-dark:#96581f;
    --accent-bg:#faf1e4;
    --good:#2e7d4f;
    --good-bg:#e7f5ec;
    --bad:#c0392b;
    --bad-bg:#fdecea;
    --line:#e8e1d6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  /* Sidebar */
  #sidebar{
    width:250px;
    flex-shrink:0;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(194,121,60,.22), transparent 60%),
      radial-gradient(120% 70% at 0% 100%, rgba(194,121,60,.12), transparent 55%),
      linear-gradient(160deg,#171310,#0f0c0a 70%);
    color:#efe8dd;
    padding:28px 18px 24px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand-kicker{
    font-size:10.5px;
    letter-spacing:3px;
    color:#a9754a;
    font-weight:700;
    margin-bottom:14px;
  }
  #sidebar h1{
    font-size:34px;
    line-height:1.15;
    margin:0 0 6px;
    color:#fbf6ef;
    font-weight:800;
    letter-spacing:2px;
    text-shadow:0 1px 0 rgba(255,255,255,.15), 0 2px 10px rgba(194,121,60,.35);
  }
  .brand-en{
    font-size:10px;
    letter-spacing:3.5px;
    color:#c2793c;
    font-weight:700;
    margin-bottom:4px;
  }
  .brand-sub{
    font-size:12px;
    color:#bdb2a2;
    margin-bottom:14px;
  }
  #sidebar hr{
    border:none;
    border-top:1px solid rgba(255,255,255,.14);
    margin:14px 0;
  }
  #sidebar .tagline{
    font-size:12px;
    color:#d8b48a;
    line-height:1.8;
    margin-bottom:22px;
  }
  .nav-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    font-size:13.5px;
    color:#d9d0c3;
    transition:background .15s;
  }
  .nav-item:hover{ background:rgba(255,255,255,.06); }
  .nav-item.active{ background:var(--accent); color:#fff; font-weight:600; }
  .nav-item .score-pill{
    font-size:11px;
    background:rgba(255,255,255,.08);
    color:#d9d0c3;
    padding:2px 7px;
    border-radius:20px;
  }
  .nav-item.active .score-pill{ background:rgba(255,255,255,.25); color:#fff; }
  #overall{
    margin-top:20px;
    padding:14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    font-size:12.5px;
    color:#d9d0c3;
  }
  #overall .num{
    font-size:22px;
    color:#eab676;
    font-weight:700;
  }
  #resetAllBtn{
    margin-top:14px;
    width:100%;
    padding:8px;
    background:transparent;
    border:1px solid rgba(255,255,255,.18);
    color:#bdb2a2;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
  }
  #resetAllBtn:hover{ border-color:var(--accent); color:#eab676; }

  /* Main */
  #main{
    flex:1;
    padding:40px 48px 80px;
    max-width:880px;
  }
  .chapter-header{
    margin-bottom:28px;
    padding-bottom:18px;
    border-bottom:2px solid var(--line);
  }
  .chapter-eyebrow{
    color:var(--accent);
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  .chapter-header h2{
    margin:0 0 10px;
    font-size:26px;
  }
  .chapter-header p{
    margin:0;
    color:var(--sub);
    font-size:14.5px;
    line-height:1.7;
  }
  .concept-box{
    background:var(--accent-bg);
    border:1px solid #ecdcc3;
    border-radius:10px;
    padding:16px 20px;
    margin-bottom:28px;
    font-size:13.5px;
    line-height:1.9;
    color:#4a4238;
  }
  .concept-box b{ color:var(--accent-dark); }
  .concept-box table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13px;}
  .concept-box td, .concept-box th{ border:1px solid #ecdcc3; padding:6px 8px; text-align:left; }
  .concept-box th{ background:#f3e6d2; }

  .qcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(16,24,40,.05);
  }
  .qmeta{
    font-size:11.5px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.5px;
    margin-bottom:8px;
    text-transform:uppercase;
  }
  .qtext{
    font-size:15.5px;
    font-weight:600;
    margin-bottom:14px;
    line-height:1.6;
  }
  .options{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:background .12s, border-color .12s;
  }
  .option:hover{ background:var(--accent-bg); }
  .option input{ margin-top:3px; }
  .option.correct{ background:var(--good-bg); border-color:var(--good); }
  .option.wrong{ background:var(--bad-bg); border-color:var(--bad); }
  .option.disabled{ cursor:default; }

  .btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:8px;
    font-size:13.5px;
    cursor:pointer;
    font-weight:600;
  }
  .btn:hover{ background:var(--accent-dark); }
  .btn.secondary{
    background:transparent;
    color:var(--accent-dark);
    border:1px solid var(--accent);
  }
  .btn.secondary:hover{ background:var(--accent-bg); }
  .btn:disabled{ background:#e3d4bf; cursor:default; }

  .feedback{
    margin-top:12px;
    padding:12px 14px;
    border-radius:8px;
    font-size:13.5px;
    line-height:1.7;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--good-bg); color:#1f5c3a; border:1px solid #bfe3cd; }
  .feedback.bad{ background:var(--bad-bg); color:#8f2c20; border:1px solid #f1c3bc; }

  textarea{
    width:100%;
    min-height:90px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
    margin-bottom:12px;
  }
  .ref-answer{
    margin-top:10px;
    padding:12px 14px;
    background:var(--accent-bg);
    border-left:3px solid var(--accent);
    border-radius:4px;
    font-size:13.5px;
    line-height:1.8;
    display:none;
  }
  .ref-answer.show{ display:block; }
  .row-actions{ display:flex; gap:10px; align-items:center; }

  .chapter-nav-footer{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
  }
  @media (max-width:800px){
    body{ flex-direction:column; }
    #sidebar{ width:100%; height:auto; position:relative; }
    #main{ padding:24px; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand-kicker">KIM・阿金！人生進化中</div>
  <h1>提問課</h1>
  <div class="brand-en">THE POWER OF QUESTIONS</div>
  <div class="brand-sub">工作優化指南・互動式系統練習</div>
  <hr>
  <div class="tagline">重複的提問會讓你困在原地，<br>好的提問會帶你前進。</div>
  <div id="navList"></div>
  <div id="overall">
    <div>目前總得分</div>
    <div class="num" id="overallScore">0 / 0</div>
  </div>
  <button id="resetAllBtn">重設全部作答紀錄</button>
</div>

<div id="main"></div>

<script>
/* ===================== 內容資料 ===================== */
const chapters = [
  {
    key: "ch0",
    title: "核心心法",
    eyebrow: "START・暖身",
    intro: "進入六個章節之前，先建立三個貫穿全場的核心框架：提問三層次、Q-A-E 三角、以及壞提問負循環。",
    concept: `
      <p><b>AI 時代核心命題：</b>當生產力不再是稀缺資源時，什麼變得更重要？→ <b>決策力</b>。</p>
      <p><b>提問三層次：</b>求知 → 求解 → 求變（背後是上游思維與冰山問題）</p>
      <table>
        <tr><th>層次</th><th>功能</th><th>提問目的範例</th></tr>
        <tr><td>表層</td><td>對方想解決什麼事情？</td><td>如何提高收入？</td></tr>
        <tr><td>中層</td><td>為什麼這件事情重要？</td><td>因為我希望生活更穩定</td></tr>
        <tr><td>深層</td><td>對方真正重視什麼？</td><td>我希望家人不再承受經濟壓力</td></tr>
      </table>
      <p style="margin-top:10px;"><b>Q-A-E 三角：</b>提問(Q) → 答案(A) → 行動(E)。知道答案，不代表事情會改變；核心框架的意義在於要銜接到行動。</p>
      <p><b>壞提問負循環：</b>壞的提問(帶著預設/偏見/錯誤方向) → 失真的答案(片面或防衛性資訊) → 錯誤的判斷(把推測當事實) → 無效的行動(投入資源卻無法解決) → 問題沒解決，卻持續重複。</p>
    `,
    questions: [
      {type:"mc", q:"AI 時代，當生產力不再是稀缺資源時，什麼變得更重要？",
        options:["執行力","決策力","記憶力","社交力"], correct:1,
        explain:"課程開場即點出核心命題：答案是「決策力」。提問的終極目的就是幫助我們做出更好的決策。"},
      {type:"mc", q:"提問的三個層次，正確順序是？",
        options:["求解 → 求知 → 求變","求知 → 求解 → 求變","求變 → 求知 → 求解","求知 → 求變 → 求解"], correct:1,
        explain:"先靠提問取得資訊與理解（求知），再找出解法（求解），最後才能推動改變（求變）。"},
      {type:"mc", q:"在「上游思維、冰山問題」中，深層提問要挖掘的是？",
        options:["對方想解決什麼事情","為什麼這件事情重要","對方真正重視什麼","以上皆非"], correct:2,
        explain:"表層問「想解決什麼」、中層問「為什麼重要」、深層才問到「真正重視什麼」，也就是動機的根源。"},
      {type:"tf", q:"Q-A-E 三角中，只要得到了答案（A），事情就一定會改變。",
        correct:false,
        explain:"錯。課程明確強調「知道答案，不代表事情會改變」，答案必須銜接到行動（E）才有意義。"},
      {type:"mc", q:"壞提問負循環的正確順序是？",
        options:[
          "壞的提問 → 錯誤的判斷 → 失真的答案 → 無效的行動",
          "壞的提問 → 失真的答案 → 錯誤的判斷 → 無效的行動",
          "失真的答案 → 壞的提問 → 無效的行動 → 錯誤的判斷",
          "壞的提問 → 無效的行動 → 失真的答案 → 錯誤的判斷"
        ], correct:1,
        explain:"壞的提問帶來失真的答案，失真的答案導致錯誤的判斷，錯誤的判斷又導致無效的行動，然後循環回到壞的提問。"},
      {type:"open", q:"寫下你最近工作中問過的一個「壞問題」，並指出它落入壞提問負循環的哪一個階段（提問／答案／判斷／行動）。",
        ref:"沒有標準答案。自我檢查重點：這個問題是否帶著預設立場或指責？得到的回答是不是防衛性的片面資訊？你是否因此做出了以偏概全的判斷？最後投入的行動有沒有真正解決問題？"}
    ]
  },
  {
    key:"ch1",
    title:"提問的力量",
    eyebrow:"CHAPTER 1",
    intro:"從被動轉為主動：提問如何決定我們的選擇、注意力，以及如何看見自己的認知盲點。",
    concept:`
      <p><b>主動的力量：</b>把陳述句改成行動導向的提問。</p>
      <ul>
        <li>「我沒辦法。」→「我目前能做到的最小一步是什麼？」</li>
        <li>「這件事太難了。」→「如果把這件事拆成十個步驟，第一步是什麼？」</li>
        <li>「現在環境就是不好。」→「在無法改變環境的情況下，我還能控制什麼？」</li>
      </ul>
      <p><b>周哈里窗（認知的力量）：</b></p>
      <table>
        <tr><th>象限</th><th>定義</th></tr>
        <tr><td>開放</td><td>對方知道，自己也知道</td></tr>
        <tr><td>盲目</td><td>對方知道，自己不知道</td></tr>
        <tr><td>隱藏</td><td>對方不知道，自己知道</td></tr>
        <tr><td>未知</td><td>對方不知道，自己也不知道</td></tr>
      </table>
    `,
    questions:[
      {type:"mc", q:"周哈里窗中，「對方知道，自己不知道」屬於哪一區？",
        options:["開放","盲目","隱藏","未知"], correct:1,
        explain:"這就是「盲目」區——別人看得到、自己卻沒意識到的部分，往往要靠別人的提問才能被看見。"},
      {type:"mc", q:"「我沒辦法。」若用主動式提問改寫，較合適的是？",
        options:["誰該為這件事負責？","我目前能做到的最小一步是什麼？","這件事有多難？","為什麼會這樣？"], correct:1,
        explain:"主動的力量強調「讓人從被動轉向主動」，重點是把注意力導向下一步可以做的行動。"},
      {type:"tf", q:"「決策的力量」強調的是：提問決定我們如何選擇。",
        correct:true,
        explain:"對。課程原文第一點就是「提問決定我們如何選擇」。"},
      {type:"mc", q:"一家企業面臨現金流不足，一般問題是「我們要怎麼增加收入？」。下列哪一句最能引導更深層的思考？",
        options:["我們還有多少現金可以使用？","誰該為現金不足負責？","為什麼業績不好？","要不要關掉公司？"], correct:0,
        explain:"課程範例列出多個更值得思考的問題（現金水位、延後支出、找出高效現金流客群、惡化風險等），這一題聚焦盤點現有資源，是典型的深層提問起點。"},
      {type:"open", q:"想一句你自己常說的「限制性陳述句」（例如「現在環境就是不好」），把它改寫成一個行動導向的提問。",
        ref:"自我檢查：改寫後的句子是否把焦點從「抱怨現況」轉向「我能控制 / 能做的下一步」？是否具體到可以馬上行動？"}
    ]
  },
  {
    key:"ch2",
    title:"好提問與壞提問",
    eyebrow:"CHAPTER 2",
    intro:"有些問題幫助思考，有些問題反而限制思考。認識提問的六大核心作用，以及壞提問帶來的七種負面效果。",
    concept:`
      <p><b>提問的核心（六大作用）：</b></p>
      <table>
        <tr><th>作用</th><th>核心目的</th><th>代表問題</th></tr>
        <tr><td>① 獲取資訊</td><td>補足不知道的事情</td><td>現在發生了什麼？</td></tr>
        <tr><td>② 釐清認知</td><td>消除模糊、確認理解</td><td>你說的效率低，是指哪個環節？</td></tr>
        <tr><td>③ 探索真相</td><td>尋找原因、證據與盲點</td><td>我們為什麼認為這是主要原因？</td></tr>
        <tr><td>④ 創造可能</td><td>突破假設、產生新的選擇</td><td>如果不使用現在的方法呢？</td></tr>
        <tr><td>⑤ 建立連結</td><td>理解他人的感受、需求與觀點</td><td>這件事對你為什麼重要？</td></tr>
        <tr><td>⑥ 推動改變</td><td>形成決策、承諾與行動</td><td>接下來我們最應該做什麼？</td></tr>
      </table>
      <p style="margin-top:10px;"><b>壞提問帶來的效果：</b></p>
      <table>
        <tr><th>負面效果</th><th>如何發生</th><th>範例</th></tr>
        <tr><td>① 認知偏誤</td><td>讓人只尋找支持原本想法的資訊</td><td>為什麼現在的年輕人都不負責任？</td></tr>
        <tr><td>② 錯誤歸因</td><td>將問題歸於錯誤原因</td><td>為什麼業績不好都是業務的錯？</td></tr>
        <tr><td>③ 情緒防衛</td><td>讓人感受到攻擊、否定與責備</td><td>這麼簡單的事，你怎麼會做錯？</td></tr>
        <tr><td>④ 關係破壞</td><td>降低信任，讓人不願意分享資訊</td><td>你是不是根本不在乎我？</td></tr>
        <tr><td>⑤ 限制可能</td><td>過早縮小選項，忽略其他解法</td><td>我們只能裁員還是減薪？</td></tr>
        <tr><td>⑥ 錯誤決策</td><td>根據不完整或誤導性資訊做判斷</td><td>要增加多少廣告才能救營收？</td></tr>
        <tr><td>⑦ 無效行動</td><td>把時間、資源投入錯誤方向</td><td>如何讓所有員工加班更久？</td></tr>
      </table>
    `,
    questions:[
      {type:"mc", q:"「你說的效率低，是指哪個環節？」主要發揮哪一種核心作用？",
        options:["獲取資訊","釐清認知","探索真相","創造可能"], correct:1,
        explain:"這句話在消除模糊、確認對方真正的意思，對應「釐清認知」。"},
      {type:"mc", q:"「如果不使用現在的方法呢？」主要發揮哪一種核心作用？",
        options:["建立連結","創造可能","推動改變","探索真相"], correct:1,
        explain:"這句話在打破既有假設、尋找新選擇，對應「創造可能」。"},
      {type:"mc", q:"「為什麼現在的年輕人都不負責任？」這類問句，最可能造成哪一種壞提問效果？",
        options:["情緒防衛","認知偏誤","關係破壞","限制可能"], correct:1,
        explain:"這類帶著預設立場的問題，會讓人只尋找支持原本想法的資訊，屬於「認知偏誤」。"},
      {type:"mc", q:"「你是不是根本不在乎我？」這句話最可能造成？",

/* ===================== 狀態管理 ===================== */
const STORAGE_KEY = "ajin_quiz_state_v1";
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const s = {};
  chapters.forEach(ch=>{
    s[ch.key] = ch.questions.map(()=>({answered:false, selected:null, openText:"", revealed:false}));
  });
  return s;
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let currentChapter = chapters[0].key;

/* ===================== 渲染 ===================== */
function chapterScore(ch){
  const qs = ch.questions;
  const st = state[ch.key];
  let correct=0, total=0;
  qs.forEach((q,i)=>{
    if(q.type==="mc" || q.type==="tf"){
      total++;
      if(st[i].answered && isCorrect(q, st[i])) correct++;
    }
  });
  return {correct, total};
}

function isCorrect(q, s){
  if(q.type==="mc") return s.selected === q.correct;
  if(q.type==="tf") return s.selected === q.correct;
  return false;
}

function renderSidebar(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  let totalCorrect=0, totalAll=0;
  chapters.forEach(ch=>{
    const {correct,total} = chapterScore(ch);
    totalCorrect += correct; totalAll += total;
    const item = document.createElement("div");
    item.className = "nav-item" + (ch.key===currentChapter ? " active" : "");
    item.innerHTML = `<span>${ch.eyebrow.replace("CHAPTER ","Ch.")}　${ch.title}</span><span class="score-pill">${correct}/${total}</span>`;
    item.onclick = ()=>{ currentChapter = ch.key; render(); window.scrollTo(0,0); };
    nav.appendChild(item);
  });
  document.getElementById("overallScore").textContent = `${totalCorrect} / ${totalAll}`;
}

function renderMain(){
  const ch = chapters.find(c=>c.key===currentChapter);
  const main = document.getElementById("main");
  main.innerHTML = "";

  const header = document.createElement("div");
  header.className = "chapter-header";
  header.innerHTML = `
    <div class="chapter-eyebrow">${ch.eyebrow}</div>
    <h2>${ch.title}</h2>
    <p>${ch.intro}</p>
  `;
  main.appendChild(header);

  const concept = document.createElement("div");
  concept.className = "concept-box";
  concept.innerHTML = ch.concept;
  main.appendChild(concept);

  ch.questions.forEach((q,i)=>{
    main.appendChild(renderQuestion(ch, q, i));
  });

  const footer = document.createElement("div");
  footer.className = "chapter-nav-footer";
  const idx = chapters.findIndex(c=>c.key===ch.key);
  const prevBtn = document.createElement("button");
  prevBtn.className = "btn secondary";
  prevBtn.textContent = "← 上一章";
  prevBtn.disabled = idx===0;
  prevBtn.onclick = ()=>{ currentChapter = chapters[idx-1].key; render(); window.scrollTo(0,0); };
  const nextBtn = document.createElement("button");
  nextBtn.className = "btn";
  nextBtn.textContent = "下一章 →";
  nextBtn.disabled = idx===chapters.length-1;
  nextBtn.onclick = ()=>{ currentChapter = chapters[idx+1].key; render(); window.scrollTo(0,0); };
  footer.appendChild(prevBtn);
  footer.appendChild(nextBtn);
  main.appendChild(footer);
}

function renderQuestion(ch, q, i){
  const st = state[ch.key][i];
  const card = document.createElement("div");
  card.className = "qcard";

  const metaLabel = q.type==="open" ? "開放練習題・自我檢核" : "選擇題";
  card.innerHTML = `<div class="qmeta">第 ${i+1} 題・${metaLabel}</div><div class="qtext">${q.q}</div>`;

  if(q.type==="mc" || q.type==="tf"){
    const opts = q.type==="tf" ? ["對","錯"] : q.options;
    const optWrap = document.createElement("div");
    optWrap.className = "options";

    opts.forEach((optText, oi)=>{
      const optVal = q.type==="tf" ? (oi===0) : oi;
      const label = document.createElement("label");
      label.className = "option" + (st.answered ? " disabled" : "");
      const inputId = `${ch.key}_${i}_${oi}`;
      label.innerHTML = `<input type="radio" name="${ch.key}_${i}" id="${inputId}" ${st.answered?"disabled":""} ${st.selected===optVal?"checked":""}> <span>${optText}</span>`;
      label.querySelector("input").addEventListener("change", ()=>{ st.selected = optVal; });

      if(st.answered){
        const correctVal = q.correct;
        if(optVal===correctVal) label.classList.add("correct");
        else if(optVal===st.selected) label.classList.add("wrong");
      }
      optWrap.appendChild(label);
    });
    card.appendChild(optWrap);

    const row = document.createElement("div");
    row.className = "row-actions";
    const submitBtn = document.createElement("button");
    submitBtn.className = "btn";
    submitBtn.textContent = "提交答案";
    submitBtn.disabled = st.answered;
    submitBtn.onclick = ()=>{
      if(st.selected===null || st.selected===undefined){
        alert("請先選擇一個答案");
        return;
      }
      st.answered = true;
      saveState();
      render();
    };
    row.appendChild(submitBtn);

    if(st.answered){
      const resetBtn = document.createElement("button");
      resetBtn.className = "btn secondary";
      resetBtn.textContent = "重新作答";
      resetBtn.onclick = ()=>{
        st.answered = false; st.selected = null;
        saveState(); render();
      };
      row.appendChild(resetBtn);
    }
    card.appendChild(row);

    const fb = document.createElement("div");
    fb.className = "feedback " + (st.answered ? "show " : "") + (st.answered && isCorrect(q,st) ? "good":"bad");
    if(st.answered){
      fb.innerHTML = (isCorrect(q,st) ? "✅ 答對了！　" : "❌ 答錯了。　") + q.explain;
    }
    card.appendChild(fb);

  } else if(q.type==="open"){
    const ta = document.createElement("textarea");
    ta.placeholder = "在這裡寫下你的練習...";
    ta.value = st.openText || "";
    ta.oninput = ()=>{ st.openText = ta.value; saveState(); };
    card.appendChild(ta);

    const row = document.createElement("div");
    row.className = "row-actions";
    const revealBtn = document.createElement("button");
    revealBtn.className = "btn secondary";
    revealBtn.textContent = st.revealed ? "隱藏參考方向" : "查看參考方向";
    revealBtn.onclick = ()=>{
      st.revealed = !st.revealed;
      saveState(); render();
    };
    row.appendChild(revealBtn);
    card.appendChild(row);

    const ref = document.createElement("div");
    ref.className = "ref-answer" + (st.revealed ? " show" : "");
    ref.innerHTML = "<b>參考方向（非標準答案）：</b>" + q.ref;
    card.appendChild(ref);
  }

  return card;
}

function render(){
  renderSidebar();
  renderMain();
}

document.getElementById("resetAllBtn").onclick = ()=>{
  if(confirm("確定要清除所有作答紀錄嗎？這個動作無法復原。")){
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    render();
  }
};

render();
</script>
</body>
</html>
